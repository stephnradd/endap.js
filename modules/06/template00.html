<!doctype html>
<html lang=en-us dir=ltr>
<head>
  <link rel='stylesheet' href="/assets/css/style.css">
</head>
<body>
<!-- code begins -->

<script src="/libs/chartjs/4.5.1/chart.umd.min.js" defer></script>

<script type="importmap">
{
  "imports": {
    "endap": "/libs/endap/0.0.5/endap.min.js"
  }
}
</script>


<div id="cnt1">
</div>


<script type=module>
const cnt = document.getElementById("cnt1");
Object.assign(cnt.style, {
  border: "0px solid green",
  height: "250px",
  display: "flex",
});

const div = document.createElement("div");
Object.assign(div.style, {
  border: "0px solid blue",
  flex: 1,
  display: "flex",
  marginRight: "10px",
});

const can = document.createElement("canvas");
Object.assign(can.style, {
  flex: 2,
  border: "1px solid var(--muted-border)",
});


/*
  console
*/

import { Console as CLI } from "endap"

const consoles = CLI.create("78%");
const cli = consoles.el;
Object.assign(cli.style, {
  flex: 5,
});
consoles.setTitle("data x (x1) dan y (x2)");


/*
  data
*/

import { Tensor1D as T1D } from "endap"

const n = 20;
const x0 = 1;
const y0 = 1;
const v0x = 10;
const v0y = 10;
const ax = 0.1;
const ay = -0.5;
const x1 = T1D.create(n);
const x2 = T1D.create(n);

for(let i = 0; i < n; i++) {
  x1[i] = x0 + v0x*i + 0.5*ax*i**2;
  x2[i] = y0 + (v0y/v0x)*(x1[i] - x0) + 0.5*ay/(v0x**2) * (x1[i] - x0)**2;;
}

const data1 = T1D.create(n);

for(let i = 0; i < n; i++) {
  const point = {
    x: x1[i],
    y: x2[i],
  };
  data1[i] = point;
}


/*
  output to cli
*/

consoles.log("x1\tx2");
for(let i = 0; i < n; i++) {
  const x1s = x1[i].toFixed(3);
  const x2s = x2[i].toFixed(3);

  consoles.log(x1s, "\t");
  consoles.log(x2s);
}


/*
  output to cavas with chartjs
*/

const config = {
  type: 'scatter',
  
  data: {
    datasets: [
      {
        label: "y-x",
        data: data1,
        radius: 4,
        hoverRadius: 6,
        showLine: true,
      },
    ],
  },

  options: {    
    scales: {
    
      x: {
        type: 'linear',
        title: {
          display: true,
          text: 'x',
          font: { size: 14, },
        },
      },
      
      y: {
        type: 'linear',
        title: {
          display: true,
          text: 'y',
          font: { size: 14, },
        },
      },
    
    },
  },

};
const chart = new Chart(can, config);


/*
  layouts
*/

cnt.append(div);
  div.append(cli);
cnt.append(can);
</script>

<!-- code ends -->
</body>
</html>
